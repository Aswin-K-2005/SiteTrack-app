<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Modern Favicon Links & Fallback -->
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    
    <!-- THE FIX: Point to the manifest in the root directory -->
    <link rel="manifest" crossorigin="use-credentials" href="/site.webmanifest" />    
    
    <!-- EDGE-TO-EDGE PWA META TAGS -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Apple Web App Title to force iOS to recognize the icon -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SiteTrack" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    
    <!-- Match the Android system bar to your dock's background color! -->
    <meta name="theme-color" content="#1a202c" />

    <!-- THE BULLETPROOF MATERIAL ICONS LINK -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" />
    <title>SiteTrack - AA&S Constructions</title>
  </head> 
  <body class="bg-[#0c1322] text-slate-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
